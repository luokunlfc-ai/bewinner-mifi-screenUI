<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeWinner 直播盒子 · 屏幕UI原型 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* screen palette — mirrors the reference: pure black, no card fills */
  --bg:#000000;
  --raise:#101216;
  --divider:#23262D;
  --text:#FFFFFF;
  --text-2:#8A8F9C;
  --text-3:#555964;
  --blue:#0A84FF;
  --up:#32D74B;
  --down:#3FC7E6;
  --warn:#FF9F0A;
  --alert:#FF453A;
  /* shell palette */
  --room:#07080A;
  --chassis-a:#2A2F37;
  --chassis-b:#12151A;
  --rail-line:#20242B;
  --num:'Barlow',sans-serif;
  --cond:'Barlow Semi Condensed',sans-serif;
  --cn:'Noto Sans SC','PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--room);min-height:100vh;font-family:var(--cn);
  color:var(--text);user-select:none;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:44px 24px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 62% 52% at 50% 40%,#161A20 0%,#0B0D10 58%,var(--room) 100%);
}
.stage{
  position:relative;z-index:2;display:grid;
  grid-template-columns:auto minmax(214px,242px);
  gap:clamp(30px,5vw,64px);align-items:center;
}
@media(max-width:880px){.stage{grid-template-columns:auto;gap:34px}}

/* ══ device chassis — echoes the reference hardware ══ */
.device{
  position:relative;border-radius:34px;padding:16px 15px 15px;
  background:linear-gradient(158deg,var(--chassis-a),var(--chassis-b) 46%,#0D1013);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.11),
    inset 0 -1px 0 rgba(0,0,0,.6),
    0 0 0 1px #05070A,
    0 28px 64px -16px rgba(0,0,0,.9);
  animation:rise .8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}

/* ══ screen ══ */
.screen{
  width:320px;height:480px;background:var(--bg);border-radius:22px;
  overflow:hidden;position:relative;
  box-shadow:0 0 0 1px #000,0 0 0 6px #0A0C0F,inset 0 0 30px rgba(0,0,0,.9);
}
.screen::after{
  content:'';position:absolute;inset:0;z-index:90;pointer-events:none;border-radius:22px;
  background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.012) 26%,transparent 48%);
}
.vp{position:absolute;inset:0;display:flex;flex-direction:column}

/* ══ status bar ══ */
.sbar{
  height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;font-family:var(--num);font-size:10.5px;font-weight:500;
  color:var(--text-2);letter-spacing:.02em;
}
.sbar .sb-r{display:flex;align-items:center;gap:5px}
.batt{display:flex;align-items:center;gap:3px}
.batt-shell{width:21px;height:10.5px;border:1px solid #6C7280;border-radius:2.5px;padding:1.5px;position:relative}
.batt-shell::after{content:'';position:absolute;right:-3px;top:3px;width:1.5px;height:4.5px;background:#6C7280;border-radius:0 1px 1px 0}
/* fill must be block — width/height are ignored on an inline span */
.batt-fill{display:block;height:100%;min-width:1.5px;border-radius:1px;
  background:var(--up);transition:width .4s ease,background .3s ease}
.batt-shell.warn .batt-fill{background:var(--warn)}
.batt-shell.low .batt-fill{background:var(--alert)}
.batt-shell.warn{border-color:var(--warn)}
.batt-shell.low{border-color:var(--alert)}
.batt-shell.warn::after{background:var(--warn)}
.batt-shell.low::after{background:var(--alert)}
/* status-bar feature indicators (Wi-Fi / NFC): blue marks "this feature is live" */
.sb-ic{display:flex;align-items:center;color:var(--blue)}

/* ══ page header ══ */
.phead{
  height:36px;flex-shrink:0;display:grid;grid-template-columns:1fr;
  align-items:center;padding:0 8px;
}
.phead .ph-t{
  text-align:center;font-size:14px;font-weight:500;color:var(--text);
  letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ══ scroll body ══ */
.pbody{flex:1;overflow:hidden;position:relative;min-height:0}
.pscroll{position:absolute;inset:0;padding:0 14px;overflow-y:auto;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
/* home must fit one screen — no scrolling on the primary view */
.pscroll.nohome{overflow:hidden}
/* dev-only overflow alarm — never visible unless the home layout breaks */
.fit-warn{
  display:none;position:absolute;left:0;right:0;bottom:0;z-index:9;
  background:var(--alert);color:#fff;font-size:10px;font-weight:600;
  text-align:center;padding:3px 0;letter-spacing:.05em;
}
.pscroll::-webkit-scrollbar{display:none}
/* ══ HOME: aggregation mode (ref: 聚合模式主页) ══ */
.hz-title{
  text-align:center;font-size:13px;font-weight:500;color:var(--text);
  letter-spacing:.06em;margin:2px 0 0;
}
.hz-sub{
  text-align:center;font-family:var(--num);font-size:9.5px;font-weight:500;
  color:var(--text-3);letter-spacing:.14em;text-transform:uppercase;margin-top:3px;
}
/* thin arc gauge above the numbers */
.arc{position:relative;height:26px;margin:2px 0 -7px}
.arc svg{position:absolute;left:50%;transform:translateX(-50%);top:0}
.arc-tr{fill:none;stroke:#1B1E24;stroke-width:2;stroke-linecap:round}
.arc-vl{fill:none;stroke:var(--up);stroke-width:2;stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(50,215,75,.55));transition:stroke-dashoffset .55s cubic-bezier(.16,1,.3,1)}
/* the twin hero readouts */
.rates{display:grid;grid-template-columns:1fr 1fr;align-items:end}
.rate{text-align:center;position:relative}
.rate .r-lb{
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-family:var(--num);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:1px;
}
.rate.up .r-lb{color:var(--up)}
.rate.down .r-lb{color:var(--down)}
.rate .r-nm{
  font-family:var(--num);font-size:36px;font-weight:600;line-height:.92;
  letter-spacing:-.028em;font-variant-numeric:tabular-nums;
}
.rate.up .r-nm{color:var(--up);text-shadow:0 0 22px rgba(50,215,75,.3)}
.rate.down .r-nm{color:var(--down);text-shadow:0 0 22px rgba(63,199,230,.28)}
.rate .r-un{
  font-family:var(--num);font-size:9.5px;font-weight:500;color:var(--text-3);
  letter-spacing:.1em;margin-top:2px;
}
.rates::after{
  content:'';position:absolute;left:50%;top:16%;height:56%;width:1px;
  background:linear-gradient(transparent,var(--divider) 30%,var(--divider) 70%,transparent);
}
.rates{position:relative}

/* ══ link rows — divider-only, no cards ══ */
.links{margin-top:9px}
.lrow{
  display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;
  height:34px;border-top:1px solid var(--divider);
}
.lrow:last-child{border-bottom:1px solid var(--divider)}
.lrow .l-nm{font-size:11.5px;color:var(--text);font-weight:400;white-space:nowrap}
/* CN operator names — use the CN face, not the latin numeral face */
.lrow .l-op{font-family:var(--cn);font-size:9.5px;color:var(--text-3);letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .l-mid{display:flex;align-items:center;gap:6px;min-width:0}
.lrow .l-rt{
  display:flex;gap:9px;font-family:var(--num);font-size:11px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.lrow .l-rt .l-up{color:var(--up)}
.lrow .l-rt .l-dn{color:var(--down)}
.lrow.dim .l-nm,.lrow.dim .l-rt{color:var(--text-3)}
.lrow.dim .l-rt span{color:var(--text-3)}

/* inline section head with right-hand count */
.shead{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 1px 3px;margin-top:11px;
}
.shead .sh-t{font-size:10px;color:var(--text-3);letter-spacing:.1em}
.shead .sh-c{font-family:var(--num);font-size:10px;color:var(--text-3);letter-spacing:.06em}

/* ══ meta strip — 3 secondary metrics, divider separated ══ */
/* traffic cell needs more room than the other two — its label carries
   two words and its value two numbers, and 8.5px CJK wraps past ~93px */
.mstrip{
  display:grid;grid-template-columns:1.3fr .87fr .83fr;margin-top:11px;
  border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);
}
.mstrip .mc{padding:6px 2px;text-align:center;position:relative}
.mstrip .mc+.mc::before{
  content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--divider);
}
.mstrip .mc-v{
  font-family:var(--num);font-size:13px;font-weight:600;color:var(--text);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
/* CJK value cell ("内置-中国移动" = 7 glyphs). Must not wrap: a second line pushes
   the home screen past its 410px budget. 10.5px keeps it inside the 1.3fr column. */
.mstrip .mc-v.zh{font-family:inherit;font-size:10.5px;font-weight:500;white-space:nowrap}
.mstrip .mc-v .sep{color:var(--text-3);font-weight:400;margin:0 1px}
.mstrip .mc-v .dim{color:var(--text-2);font-weight:500}
.mstrip .mc-v.warm{color:var(--warn)}
.mstrip .mc-v.hot{color:var(--alert)}
.mstrip .mc-v .unit{font-size:8.5px;color:var(--text-3);font-weight:400;margin-left:2px}
.mstrip .mc-l{font-size:8.5px;color:var(--text-3);margin-top:3px;letter-spacing:.02em;
  white-space:nowrap}

/* ══ wifi footer bar on home ══ */
.wbar{
  display:grid;grid-template-columns:16px 1fr auto;align-items:center;
  column-gap:9px;row-gap:2px;margin-top:10px;padding:7px 10px;
  border-radius:9px;background:#12151A;
}
.wbar svg{color:var(--blue);flex-shrink:0;grid-row:1/3}
.wbar .wb-s{font-size:11.5px;color:var(--text);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar .wb-c{font-family:var(--num);font-size:10px;color:var(--text-3);flex-shrink:0}
/* password line: key label + monospace value */
.wbar .wb-p{
  grid-column:2/4;display:flex;align-items:baseline;gap:5px;min-width:0;
}
.wbar .wb-p em{font-style:normal;font-size:9.5px;color:var(--text-3);
  letter-spacing:.06em;flex-shrink:0}
.wbar .wb-p b{
  font-family:var(--num);font-size:11.5px;font-weight:500;color:var(--text-2);
  letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wbar.off svg{color:var(--text-3)}
.wbar.off .wb-s{color:var(--text-3)}

/* signal bars — 4 step, no text */
.sig{display:inline-flex;align-items:flex-end;gap:1.5px;height:11px}
.sig i{width:2.5px;border-radius:.5px;background:#2C3038;display:block}
.sig i:nth-child(1){height:3.5px}
.sig i:nth-child(2){height:5.5px}
.sig i:nth-child(3){height:8px}
.sig i:nth-child(4){height:11px}
.sig.s1 i:nth-child(-n+1),.sig.s2 i:nth-child(-n+2),
.sig.s3 i:nth-child(-n+3),.sig.s4 i:nth-child(-n+4){background:var(--text)}
.sig.q-mid i.on,.sig.s2 i:nth-child(-n+2),.sig.s3 i:nth-child(-n+3){background:var(--warn)}
.sig.s4 i:nth-child(-n+4){background:var(--up)}
.sig.s1 i:nth-child(-n+1){background:var(--alert)}
/* RAT tag (5G/4G) riding next to the bars — one wrapper keeps baseline aligned */
.sigrat{display:inline-flex;align-items:flex-end;gap:2px}
.sigrat .rat{font-family:var(--num);font-size:7px;font-weight:700;color:var(--text-2);
  letter-spacing:.02em;padding-bottom:.5px}

/* aggregation badge */
.agg-chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  background:rgba(50,215,75,.13);font-family:var(--num);font-size:9.5px;font-weight:600;
  color:var(--up);letter-spacing:.09em;text-transform:uppercase;
}
.agg-chip .dot{width:5px;height:5px;border-radius:50%;background:var(--up);
  box-shadow:0 0 7px var(--up);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* single-card badge — same shape as the aggregation chip, neutral colour
   so "aggregation on" stays the only green state on the home screen */
.agg-chip.mono{background:rgba(142,142,147,.15);color:var(--text-2)}
.agg-chip.mono .dot{background:var(--text-2);box-shadow:none;animation:none}
.hint-bar{
  margin:11px 0 0;padding:8px 11px;border-radius:9px;
  background:rgba(255,159,10,.1);display:flex;align-items:center;gap:8px;
}
.hint-bar .hb-t{font-size:11px;color:var(--warn);line-height:1.45}

/* ══ page dots ══ */
.dots{
  flex-shrink:0;height:22px;display:flex;align-items:center;justify-content:center;gap:5px;
}
.dots i{width:4.5px;height:4.5px;border-radius:50%;background:#2A2E36;transition:all .3s}
.dots i.on{background:var(--text-2);width:14px;border-radius:3px}
/* ══ SETTINGS LIST (ref: 设置页) — divider rows, iOS switches ══ */
.list{padding-bottom:6px}
.row{
  position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;
  gap:10px;min-height:44px;padding:7px 10px;border-bottom:1px solid var(--divider);
  border-radius:8px;transition:background .16s ease;
}
.row:last-child{border-bottom:none}
.row .r-l{min-width:0}
.row .r-t{font-size:13px;color:var(--text);font-weight:400;line-height:1.3}
.row .r-s{font-family:var(--num);font-size:10px;color:var(--text-3);
  margin-top:2px;letter-spacing:.03em;line-height:1.35}
.row .r-v{
  font-family:var(--num);font-size:12px;color:var(--text-2);
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.row .r-v .chev{color:var(--text-3);font-size:15px;line-height:1}
/* focus: subtle raised fill + blue left marker, NOT full inversion */
.row.fx{background:#161A20}
.row.fx::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;
  border-radius:2px;background:var(--blue);box-shadow:0 0 8px rgba(10,132,255,.6);
}
.row.fx .r-t{color:#fff;font-weight:500}
.row.disabled{opacity:.36}
.row.danger .r-t{color:var(--alert)}
/* brightness edit mode (v2.8): OK on the value row enters/leaves it, ↑↓ adjusts
   while inside — blue accents mark the row as "live" */
.row.editing .r-t{color:var(--blue)}
.row.editing .r-v{color:var(--blue)}
/* slider rendered as a non-focusable list row (brightness page) */
.sld-row{padding:12px 10px 6px}

/* iOS-style switch */
.sw{
  width:38px;height:22px;border-radius:12px;background:#2C3038;position:relative;
  transition:background .24s cubic-bezier(.16,1,.3,1);flex-shrink:0;
}
.sw i{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);
  transition:transform .24s cubic-bezier(.16,1,.3,1);
}
.sw.on{background:var(--blue)}
.sw.on i{transform:translateX(16px)}

/* radio */
.rd{width:17px;height:17px;border-radius:50%;border:1.5px solid #3A3F49;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rd.on{border-color:var(--blue)}
.rd.on::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--blue)}

/* section label */
.sect{
  font-family:var(--num);font-size:9.5px;font-weight:600;color:var(--text-3);
  letter-spacing:.16em;text-transform:uppercase;padding:14px 10px 6px;
}
.sect.gap{padding:0;height:13px}

/* ══ slider ══ */
.sld{height:4px;border-radius:2px;background:#2C3038;position:relative;margin:9px 0 3px}
.sld .sf{height:100%;border-radius:2px;background:var(--blue);transition:width .2s ease}
.sld .sk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.5);transition:left .2s ease}
/* auto-brightness on → manual slider is inert */
.sld.dim{opacity:.32}
.sld.dim .sf{background:var(--text-3)}
.sld.dim .sk{background:var(--text-2)}

/* ══ client disconnect button ══ */
.dc-btn{
  font-size:10.5px;color:var(--text-3);padding:3.5px 10px;border-radius:20px;
  border:1px solid var(--divider);flex-shrink:0;transition:all .16s ease;
}
.dc-btn.on{color:var(--alert);border-color:rgba(255,69,58,.5);background:rgba(255,69,58,.12)}

/* ══ diagnosis ══ */
.dg{display:flex;align-items:center;gap:10px;min-height:38px;
  border-bottom:1px solid var(--divider);padding:5px 10px}
.dg .dg-i{width:18px;font-family:var(--num);font-size:10px;color:var(--text-3);flex-shrink:0}
.dg .dg-n{flex:1;font-size:12px;color:var(--text-2)}
.dg .dg-r{font-family:var(--num);font-size:10.5px;display:flex;align-items:center;gap:5px}
.dg.run .dg-n{color:var(--text)}
.dg.run .dg-r{color:var(--blue)}
.dg.ok .dg-n{color:var(--text)}
.dg.ok .dg-r{color:var(--up)}
.dg.err .dg-r{color:var(--alert)}
.spin{width:11px;height:11px;border:1.5px solid rgba(10,132,255,.25);
  border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ progress ══ */
.pg{height:5px;border-radius:3px;background:#22262E;overflow:hidden;margin:12px 0 8px}
.pg .pf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),#5AC8FA);
  transition:width .3s ease}

/* ══ QR ══ */
.qr-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.qr{width:150px;height:150px;background:#fff;border-radius:10px;padding:9px;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.qr svg{display:block;width:100%;height:100%}
/* binding page carries two codes: bind (primary) + download (secondary) */
.qr.bind{width:124px;height:124px;padding:7px;border-radius:9px}
.qr.dl{width:62px;height:62px;padding:4px;border-radius:6px;flex-shrink:0}
.dl-blk{
  display:flex;align-items:center;gap:10px;text-align:left;
  margin-top:11px;padding-top:10px;border-top:1px solid var(--divider);width:100%;
}
.dl-tx{font-size:10.5px;color:var(--text-2);line-height:1.55}
.dl-tx span{color:var(--text-3);font-size:10px}
.dl-tx b{color:var(--text-2);font-weight:500}

/* ══ big centered notice ══ */
.notice{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 22px;gap:5px;
}
.notice .nt-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin-bottom:8px}
.notice .nt-t{font-size:15px;font-weight:500;color:var(--text)}
.notice .nt-d{font-size:11.5px;color:var(--text-2);line-height:1.7;margin-top:2px}
.steps{text-align:left;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.steps div{font-size:11px;color:var(--text-2);display:flex;gap:7px;line-height:1.45}
.steps div b{font-family:var(--num);color:var(--blue);font-weight:600;flex-shrink:0}

/* ══ bottom bar ══ */
.bbar{
  flex-shrink:0;height:24px;display:flex;align-items:center;justify-content:space-between;
  padding:0 13px;font-family:var(--num);font-size:9.5px;color:var(--text-3);
  letter-spacing:.05em;border-top:1px solid #14171C;
}
.bbar b{color:var(--text-2);font-weight:500}
/* footer back button — the virtual last focus slot of every subpage (v2.8).
   Always visible (never scrolls away); the wrap-around focus loop reaches it
   with one ↑ from the first row. */
.bk-btn{
  display:inline-flex;align-items:center;gap:2px;padding:2.5px 9px;margin-left:-9px;
  border-radius:11px;color:var(--text-2);font-weight:500;letter-spacing:.05em;
  transition:background .16s ease,color .16s ease;
}
.bk-btn.fx{background:var(--blue);color:#fff}

/* ══ toast ══ */
.toast{
  position:absolute;left:50%;bottom:38px;transform:translateX(-50%) translateY(14px);
  background:rgba(28,31,37,.97);color:#fff;font-size:11.5px;padding:8px 16px;
  border-radius:20px;opacity:0;transition:all .26s cubic-bezier(.16,1,.3,1);
  z-index:80;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.6);
  backdrop-filter:blur(12px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--up)}
.toast.err{color:var(--alert)}

/* ══ modal ══ */
.modal{
  position:absolute;inset:0;z-index:85;background:rgba(0,0,0,.68);
  display:flex;align-items:center;justify-content:center;padding:26px;
  opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px);
}
.modal.show{opacity:1;pointer-events:auto}
.modal-box{
  width:100%;background:#1A1D23;border-radius:15px;padding:17px 15px 13px;text-align:center;
  box-shadow:0 16px 40px rgba(0,0,0,.7);transform:scale(.94);transition:transform .24s cubic-bezier(.16,1,.3,1);
}
.modal.show .modal-box{transform:scale(1)}
.modal-box .m-t{font-size:14px;font-weight:500;margin-bottom:5px}
.modal-box .m-d{font-size:11.5px;color:var(--text-2);line-height:1.55;margin-bottom:14px}
.modal-box .m-b{display:flex;gap:8px}
.modal-box .m-b div{
  flex:1;padding:8px;border-radius:9px;font-size:12px;background:#282C34;color:var(--text-2);
}
.modal-box .m-b div.fx{background:var(--alert);color:#fff;font-weight:500}
.modal-box .m-b div.fx.safe{background:var(--blue)}
/* ══ physical control deck ══ */
.deck{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,28px);
  gap:3px;place-items:center}
.btn{
  border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(168deg,#343B45,#1C2128);color:#7E8593;
  font-family:var(--num);font-size:10px;font-weight:600;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -2px 3px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.5);
  transition:transform .07s ease,box-shadow .13s,color .13s,background .13s;
}
.btn.up,.btn.dn{width:28px;height:28px}
.btn.ok{width:28px;height:28px;border-radius:50%;font-size:8.5px;
  background:linear-gradient(168deg,#414A57,#222833)}
.btn.hit{
  transform:translateY(2px) scale(.95);color:#04070A;
  background:linear-gradient(168deg,var(--blue),#0060DF);
  box-shadow:inset 0 -1px 2px rgba(0,0,0,.35),0 0 0 1px rgba(10,132,255,.5),
    0 0 16px rgba(10,132,255,.6),0 0 34px rgba(10,132,255,.25);
}
.aggr-key{
  width:70px;height:70px;border-radius:18px;position:relative;
  background:linear-gradient(165deg,#343B45,#1A1F26);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -3px 5px rgba(0,0,0,.5),0 3px 7px rgba(0,0,0,.55);
  transition:all .22s cubic-bezier(.16,1,.3,1);
}
.aggr-key .ak-g{color:#6E757F;display:flex;transition:color .22s,filter .22s}
.aggr-key .ak-t{font-family:var(--cond);font-size:10px;font-weight:600;
  letter-spacing:.13em;color:#5A6069;text-transform:uppercase;transition:color .22s}
.aggr-key.live{
  background:linear-gradient(165deg,#0B3A1C,#052113);
  box-shadow:inset 0 1px 0 rgba(50,215,75,.28),inset 0 -3px 5px rgba(0,0,0,.5),
    0 0 0 1px rgba(50,215,75,.4),0 0 24px rgba(50,215,75,.4),0 0 54px rgba(50,215,75,.14);
  animation:breathe 2.7s ease-in-out infinite;
}
.aggr-key.live .ak-g{color:var(--up);filter:drop-shadow(0 0 8px rgba(50,215,75,.85))}
.aggr-key.live .ak-t{color:var(--up)}
@keyframes breathe{
  0%,100%{box-shadow:inset 0 1px 0 rgba(50,215,75,.28),inset 0 -3px 5px rgba(0,0,0,.5),
    0 0 0 1px rgba(50,215,75,.4),0 0 24px rgba(50,215,75,.4),0 0 54px rgba(50,215,75,.14)}
  50%{box-shadow:inset 0 1px 0 rgba(50,215,75,.4),inset 0 -3px 5px rgba(0,0,0,.5),
    0 0 0 1px rgba(50,215,75,.6),0 0 36px rgba(50,215,75,.6),0 0 76px rgba(50,215,75,.24)}
}
.aggr-key.hit{transform:translateY(3px) scale(.95)}

/* ══ annotation rail ══ */
.rail{display:flex;flex-direction:column;gap:20px;
  animation:rise .9s cubic-bezier(.16,1,.3,1) .16s both}
.rh{border-left:2px solid var(--blue);padding-left:12px}
.rh em{display:block;font-family:var(--cond);font-style:normal;font-size:10px;font-weight:600;
  letter-spacing:.24em;color:var(--blue);text-transform:uppercase;margin-bottom:6px}
.rh h1{font-family:var(--cn);font-weight:700;font-size:21px;line-height:1.2;color:#E9EDF3;letter-spacing:.01em}
.rh p{font-size:11px;color:var(--text-3);line-height:1.65;margin-top:8px;max-width:29ch}
.tele{border-top:1px solid var(--rail-line);border-bottom:1px solid var(--rail-line);
  padding:12px 0;display:flex;flex-direction:column;gap:7px}
.tr{display:flex;align-items:baseline;gap:9px;font-family:var(--num);font-size:10px}
.tr .tk{color:var(--text-3);letter-spacing:.11em;text-transform:uppercase;min-width:70px;flex-shrink:0;font-weight:500}
.tr .tv{color:#D3DAE3;font-weight:500;font-variant-numeric:tabular-nums}
.tr .tv.on{color:var(--up)}
.tr .tv.off{color:var(--text-2)}
.tr .tv.warn{color:var(--warn)}
.lgd{display:flex;flex-direction:column;gap:6px}
.lgd .lt{font-family:var(--cond);font-size:10px;font-weight:600;letter-spacing:.2em;
  color:var(--text-3);text-transform:uppercase;margin-bottom:2px}
.lg{display:flex;align-items:center;gap:9px;font-size:10.5px;color:#96A0AE}
.lg kbd{font-family:var(--num);font-size:9px;font-weight:600;color:#C8D2DC;
  background:linear-gradient(#242A32,#15191F);padding:4px 6px;border-radius:4px;min-width:52px;
  text-align:center;letter-spacing:.04em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 1px 2px rgba(0,0,0,.5)}
.lg kbd.g{background:linear-gradient(#173B23,#0C2114);color:var(--up)}
.rf{font-family:var(--num);font-size:9px;color:#3B434D;letter-spacing:.08em;line-height:1.8}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="screen">
      <div class="vp">
        <div class="sbar" id="sbar"></div>
        <div id="hdrSlot"></div>
        <div class="pbody"><div class="pscroll" id="body"></div>
          <div id="fitWarn" class="fit-warn"></div></div>
        <div id="footSlot"></div>
      </div>
      <div class="toast" id="toast"></div>
      <div class="modal" id="modal">
        <div class="modal-box">
          <div class="m-t" id="mTitle"></div>
          <div class="m-d" id="mDesc"></div>
          <div class="m-b"><div id="mNo">取消</div><div id="mYes" class="fx">确认</div></div>
        </div>
      </div>
    </div>
    <div class="deck">
      <div class="dpad">
        <span></span><div class="btn up" id="bUp">▲</div><span></span>
        <span></span><div class="btn ok" id="bOk">OK</div><span></span>
        <span></span><div class="btn dn" id="bDn">▼</div><span></span>
      </div>
      <div class="aggr-key" id="bAggr">
        <span class="ak-g"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path
          d="M9.5 14.5 5.8 18.2a3.7 3.7 0 0 1-5.2-5.2l3.7-3.7M14.5 9.5l3.7-3.7a3.7 3.7 0 0 1 5.2 5.2l-3.7 3.7"
          transform="translate(0.3 0)"/><path d="M8.7 15.3l6.6-6.6"/></svg></span>
        <span class="ak-t">聚合</span>
      </div>
    </div>
  </div>

  <aside class="rail">
    <div class="rh">
      <em>Screen UI · v2</em>
      <h1>多网聚合<br>直播盒子</h1>
      <p>双 5G 上行聚合。三维按键 + 独立聚合键，3.5″ 非触控串口屏。</p>
    </div>
    <div class="tele">
      <div class="tr"><span class="tk">Mode</span><span class="tv off" id="tMode">STANDBY</span></div>
      <div class="tr"><span class="tk">State</span><span class="tv" id="tState">—</span></div>
      <div class="tr"><span class="tk">Screen</span><span class="tv" id="tPage">—</span></div>
      <div class="tr"><span class="tk">Uplink</span><span class="tv" id="tUp">—</span></div>
      <div class="tr"><span class="tk">Paths</span><span class="tv" id="tPath">0 / 3</span></div>
    </div>
    <div class="lgd">
      <div class="lt">Controls</div>
      <div class="lg"><kbd>↑ ↓</kbd><span>移动焦点 / 调整数值</span></div>
      <div class="lg"><kbd>Enter</kbd><span>确认 · 进入 · 切换</span></div>
      <div class="lg"><kbd>‹ 返回</kbd><span>底部栏左侧 · 焦点末位</span></div>
      <div class="lg"><kbd>主页</kbd><span>底部栏右侧 · 直达主屏</span></div>
      <div class="lg"><kbd class="g">Space</kbd><span>物理聚合键</span></div>
      <div class="lg"><kbd>1</kbd><span>切换激活状态</span></div>
    </div>
    <div class="rf">北纬 / 产品管理<br>REV v2.8 · 2026-08-07</div>
  </aside>
</div>
<script>
/* ════════ STATE ════════ */
const S={
  act:'online',            // unactivated | no-sim | online
  agg:true,
  page:'home',
  stack:[],
  fx:0,
  time:'14:36',
  batt:97,
  uptime:9318,
  defIdx:0,
  /* smart-select defaults OFF; while on, the system picks the cards and every
     manual-selection row in 数据卡管理 greys out (rowsSim) */
  smart:false,
  wifi:{on:true,ssid:'BeWinner_5G_001',pwd:'bw88888888',band:true,nfc:true},
  aggMode:0,
  rj45:0,                  // 0 LAN | 1 WAN
  bright:80,
  autoBright:false,
  brightEdit:false,        // brightness row in adjust mode: ↑↓ tunes, OK exits (v2.8)
  temp:42,                 // °C, from the SoC sensor
  data:{used:12.4,total:100},   // GB — remaining is derived, never stored twice
  clients:[
    {n:'iPhone 15 Pro', ip:'192.168.1.101', r:'5 GHz'},
    {n:'MacBook Pro',   ip:'192.168.1.102', r:'5 GHz'},
    {n:'大疆 Action 5',  ip:'192.168.1.103', r:'2.4 GHz'},
  ],
  lang:0,
  sleepIdx:0,
  diag:null,
  upg:null,
  /* bound account. The phone number is stored whole and masked at render time —
     a pre-masked copy would be a second source of truth for the same value. */
  /* unbindAt = when the request was pushed (0 = none outstanding). The pending
     state is derived from it via unbindPending() — storing a separate boolean
     would let the flag stay true after the 10-minute window lapsed. */
  acct:{name:'林望',phone:'13856726721',unbindAt:0},
  sims:[
    /* sl = slot label shown on the single-card home ("内置-中国移动") */
    {id:'m', nm:'移动',    tp:'内置', sl:'内置',  op:'中国移动', sig:4, rat:'5G', up:5.2, dn:3.1, st:'ok',    grp:'A'},
    {id:'t', nm:'电信',    tp:'内置', sl:'内置',  op:'中国电信', sig:3, rat:'5G', up:4.1, dn:2.8, st:'ok',    grp:'B'},
    {id:'e1',nm:'外置卡1', tp:'外置', sl:'外置1', op:'中国联通', sig:4, rat:'4G', up:2.0, dn:1.5, st:'ok',    grp:'A'},
    {id:'e2',nm:'外置卡2', tp:'外置', sl:'外置2', op:'',        sig:0, rat:'',   up:0,   dn:0,   st:'empty', grp:'B'},
    {id:'u', nm:'USB',     tp:'USB',  sl:'USB',   op:'中国广电', sig:4, rat:'4G', up:3.2, dn:2.2, st:'ok',    grp:'U'},
  ],
  linkA:0, linkB:1, useUsb:true,
  timers:{toast:null,idle:null,tick:null},
  modal:null,
};
const SLEEP=['5 分钟','10 分钟','15 分钟','30 分钟','从不'];
const MODES=[
  {n:'带宽叠加',d:'多路带宽实时叠加，最大化总吞吐'},
  {n:'直播模式',d:'上行优先 QoS 保障，降低抖动'},
  {n:'多发优选',d:'多路同时发送，接收端选最优'},
];
const DIAG=[
  {n:'设备连通性',t:5},{n:'DNS 解析',t:5},{n:'互联网连通性',t:8},
  {n:'服务鉴权',t:5},{n:'MQTT 上报',t:8},{n:'云端策略同步',t:8},
];
const $=i=>document.getElementById(i);
const pad=n=>String(n).padStart(2,'0');
const hhmmss=s=>`${pad(s/3600|0)}:${pad((s%3600)/60|0)}:${pad(s%60)}`;
const mmss=ms=>{const s=Math.ceil(ms/1000);return `${pad(s/60|0)}:${pad(s%60)}`};
/* ════════ HELPERS ════════ */
function sigBars(n,tone){
  let cls='sig s'+n;
  if(tone)cls+=' '+tone;
  return `<span class="${cls}"><i></i><i></i><i></i><i></i></span>`;
}
/* bars + 5G/4G tag — used everywhere a link's signal is shown */
function sigRat(l){
  return `<span class="sigrat">${sigBars(l.sig,sigTone(l.sig))}${l.rat?`<span class="rat">${l.rat}</span>`:''}</span>`;
}
function battHTML(){
  let c=S.batt<=20?'low':S.batt<=40?'warn':'';
  return `<span class="batt"><span class="batt-shell ${c}">
    <span class="batt-fill" style="width:${S.batt}%"></span></span>
    <span>${S.batt}%</span></span>`;
}
/* honour Modem A/B exclusivity — at most 3 concurrent paths */
function activeLinks(){
  if(S.act!=='online')return [];
  let out=[];
  let a=S.sims[S.linkA], b=S.sims[S.linkB];
  if(a&&a.st==='ok')out.push(a);
  if(b&&b.st==='ok')out.push(b);
  if(S.useUsb){let u=S.sims[4];if(u.st==='ok')out.push(u)}
  return out.slice(0,3);
}
function aggTotals(){
  let l=activeLinks();
  return {up:l.reduce((s,x)=>s+x.up,0), dn:l.reduce((s,x)=>s+x.dn,0), n:l.length};
}
function sigTone(n){return n>=4?'':n>=2?'q-mid':''}
/* single-card mode: which slot + operator is carrying the session, e.g. 内置-中国移动 */
function curLink(){
  let d=S.sims[S.defIdx];
  if(S.act!=='online'||!d||d.st!=='ok')return '--';
  return d.sl+(d.op?'-'+d.op:'');
}

/* ════════ CHROME ════════ */
function icoBack(sz=18){return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`}
function icoHome(sz=17){return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="currentColor"><path
  d="M12 3.2 3.4 10.3c-.3.2-.4.5-.4.8v9c0 .5.4.9.9.9h5.8v-6.3h4.6V21h5.8c.5 0 .9-.4.9-.9v-9c0-.3-.1-.6-.4-.8L12 3.2z"/></svg>`}

/* N-mark traced from prototype/nfc.png: two vertical bars plus a diagonal
   with a single mid-height step. Solid fill, not stroke — the reference is a
   silhouette, and at 13px a stroked N would dissolve. */
function icoNfc(){
  return `<svg width="8" height="13" viewBox="0 0 14 24" fill="currentColor"><path
    d="M0 0h2.4v24H0zM11.6 0H14v24h-2.4zM0 0h3.3L11 14.1H8.6L14 24h-3.4L3.5 11H6z"/></svg>`;
}
function renderStatus(){
  /* CN operator names are too wide for 3 links in a 24px bar —
     bars only here; names and path count live on the home screen below */
  let left='';
  if(S.act==='online'&&S.agg){
    left=activeLinks().map(l=>sigRat(l))
      .join('<span style="width:4px"></span>');
  }else if(S.act==='online'){
    let d=S.sims[S.defIdx];
    left=`${sigRat(d)}
      <span style="font-family:var(--cn);font-size:9px;color:var(--text-3)">${d.op}</span>`;
  }else{
    left=`<span style="color:var(--alert);font-size:10px">无信号</span>`;
  }
  /* right cluster answers "is the hotspot live" on every page — the home Wi-Fi
     strip only says so on the home screen. Wi-Fi icon first, NFC next to the
     battery; both only while Wi-Fi is on. */
  let wifiIc=S.wifi.on?`<span class="sb-ic">${icoWifi(true,13)}</span>`:'';
  let nfc=S.wifi.on&&S.wifi.nfc?`<span class="sb-ic">${icoNfc()}</span>`:'';
  $('sbar').innerHTML=
    `<span style="display:flex;align-items:center;gap:4px">${left}</span>
     <span style="font-weight:600;color:var(--text)">${S.time}</span>
     <span class="sb-r">${wifiIc}${nfc}${battHTML()}</span>`;
}
const TITLES={
  menu:'设置',acct:'账号设置',wifi:'Wi-Fi 设置',clients:'接入设备',pwd:'Wi-Fi 密码',
  sim:'数据卡管理',agglink:'聚合链路设置',
  aggmode:'聚合模式',pickA:'链路 A',pickB:'链路 B',diag:'网络诊断',
  net:'网络设置',dev:'设备设置',devinfo:'设备信息',sleep:'自动休眠',bright:'屏幕亮度',
  lang:'语言',upg:'系统升级',app:'APP 下载',
};
function renderHeader(){
  let h=$('hdrSlot');
  if(S.page==='home'||S.page==='home-normal'||S.page==='unact'||S.page==='nosim'){h.innerHTML='';return}
  h.innerHTML=`<div class="phead">
    <div class="ph-t">${TITLES[S.page]||''}</div>
  </div>`;
}
function renderFooter(){
  let f=$('footSlot');
  if(S.page==='home'||S.page==='home-normal'){
    /* aggregation home: uptime already sits in the meta strip, so the corner stays empty.
       single-card home: the strip gave cell 1 to the active link, so traffic moves here. */
    const left=Math.max(0,S.data.total-S.data.used);
    const right=S.agg?''
      :`聚合流量 已用 <b>${S.data.used.toFixed(1)}</b> GB &nbsp;·&nbsp; 剩余 <b>${left.toFixed(1)}</b> GB`;
    f.innerHTML=`<div class="dots"><i class="${S.agg?'on':''}"></i><i class="${S.agg?'':'on'}"></i></div>
      <div class="bbar"><span><b>点击确认键进入</b> 设置</span><span>${right}</span></div>`;
  }else if(S.page==='unact'||S.page==='nosim'){
    f.innerHTML=`<div class="bbar"><span><b>OK</b> ${S.page==='unact'?'放大二维码':'进入设置'}</span><span>SN BW20260700001</span></div>`;
  }else{
    /* back & home are real buttons in the footer (v2.8), replacing the
       long-press. They take the last two focus slots in visual order:
       back first (m-2), then home (m-1) — so ↓ past the last row lands
       on back. Back on an empty stack lands home anyway. */
    const m=maxFocus(), bk=S.fx===m-2, hm=S.fx===m-1;
    f.innerHTML=`<div class="bbar"><span class="bk-btn${bk?' fx':''}">${icoBack(10)} 返回</span><span class="bk-btn${hm?' fx':''}">${icoHome(11)} 主页</span></div>`;
  }
}
/* ════════ HOME — aggregation (ref layout) ════════ */
function arcGauge(pct){
  const R=52,C=Math.PI*R,off=C*(1-Math.min(1,pct));
  return `<div class="arc"><svg width="128" height="34" viewBox="0 0 128 34">
    <path class="arc-tr" d="M12 30 A52 52 0 0 1 116 30"/>
    <path class="arc-vl" d="M12 30 A52 52 0 0 1 116 30"
      stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
  </svg></div>`;
}
function icoWifi(on,sz=16){
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round">${on
    ?'<path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.1" fill="currentColor" stroke="none"/>'
    :'<path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.1" fill="currentColor" stroke="none"/><path d="M3 3l18 18"/>'}</svg>`;
}
/* three secondary metrics under the link list. Remaining data is derived from
   used/total — storing both would let them drift apart. */
function metaStrip(agg){
  const left=Math.max(0,S.data.total-S.data.used);
  const hot=S.temp>=65?'hot':S.temp>=55?'warm':'';
  /* cell 1 differs by mode: aggregation needs pooled traffic (no single link owns it),
     single-card needs to name which of the 5 slots is actually carrying the session —
     its traffic moved to the footer instead. */
  const c1=agg

/* ════════ LIST BUILDER ════════ */
/* row: {t, s, v, sw, rd, chev, dis, disMsg, danger, sect, slider, editing}
   sect rows are non-focusable; slider rows render the brightness slider and
   are non-focusable too; editing marks a row whose value is being tuned */
function buildList(rows){
  let fi=-1;
  let html=rows.map(r=>{
    /* 'sect' in r — an empty string is a spacer, still non-focusable */
    if('sect' in r)return `<div class="sect${r.sect?'':' gap'}">${r.sect}</div>`;
    if('slider' in r)return `<div class="sld-row"><div class="sld${r.dim?' dim':''}"><div class="sf" style="width:${r.slider}%"></div><div class="sk" style="left:${r.slider}%"></div></div></div>`;
    fi++;
    let cls='row'+(fi===S.fx?' fx':'')+(r.dis?' disabled':'')+(r.danger?' danger':'')+(r.editing?' editing':'');
    let right='';
    if(r.sw!==undefined)right=`<span class="sw ${r.sw?'on':''}"><i></i></span>`;
    else if(r.rd!==undefined)right=`<span class="rd ${r.rd?'on':''}"></span>`;
    else right=`<span class="r-v">${r.v?`<span>${r.v}</span>`:''}${r.chev?'<span class="chev">›</span>':''}</span>`;
    return `<div class="${cls}">
      <span class="r-l"><span class="r-t">${r.t}</span>${r.s?`<span class="r-s">${r.s}</span>`:''}</span>
      ${right}
    </div>`;
  }).join('');
  return `<div class="list">${html}</div>`;
}
const focusable=rows=>rows.filter(r=>!('sect' in r)&&!('slider' in r));

   offering a fresh one instead of waiting on an APP reply that can no longer land */
const UNBIND_TTL=600000;
const unbindLeft=()=>S.acct.unbindAt
  ? Math.max(0,UNBIND_TTL-(Date.now()-S.acct.unbindAt)) : 0;

       broken. The row stays live and explains that the request is already out.
       The countdown tells the user when they may retry instead of leaving them
       staring at a request that silently expired. */
    {t:'解除绑定',s:unbindPending()
      ?`解绑请求已发送，等待 APP 端确认（剩余 ${mmss(unbindLeft())}）`

    <span class="spin" style="width:22px;height:22px;border-width:2px"></span>
    <div class="nt-d" style="margin-top:14px">正在检查更新…</div></div>`;
  if(u.stage==='found')return `<div style="padding:14px 8px">
    <div style="font-family:var(--num);font-size:19px;font-weight:600;color:var(--blue)">v2.2.0</div>
    <div style="font-size:10.5px;color:var(--text-3);font-family:var(--num);margin-top:2px">32.6 MB</div>
    <div style="margin-top:14px;font-size:11.5px;color:var(--text-2);line-height:1.85">
      · 优化聚合算法延迟<br>· 修复 Wi-Fi 断连问题<br>· 提升弱网推流稳定性</div>
    <div class="list" style="margin-top:16px"><div class="row${S.fx===0?' fx':''}">
      <span class="r-l"><span class="r-t">开始升级</span></span>
      <span class="r-v"><span class="chev">›</span></span></div></div>
    ${S.batt<=20?`<div class="hint-bar" style="margin:14px 0 0"><span class="hb-t">电量低于 20%，请先充电</span></div>`:''}
  </div>`;
  if(u.stage==='run')return `<div style="padding:24px 8px;text-align:center">
    <div style="font-family:var(--num);font-size:34px;font-weight:600;color:var(--blue)">${u.pct}%</div>
    <div class="pg"><div class="pf" style="width:${u.pct}%"></div></div>
    <div style="font-size:11.5px;color:var(--text-2);margin-top:8px">
      ${u.pct<55?'正在下载固件包…':'正在写入系统…'}</div>
    <div style="font-size:11px;color:var(--alert);margin-top:14px">请勿关机</div>
  </div>`;
  return `<div class="notice">
    <div class="nt-ic" style="background:rgba(50,215,75,.14)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--up)"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="nt-t">升级完成</div>
    <div class="nt-d">设备将自动重启…</div></div>`;
}
function viewApp(){
  return `<div class="notice" style="padding-top:2px">
    <div class="nt-t" style="font-size:15px">松果智联 APP</div>
    <div class="nt-d" style="margin-bottom:12px">管理设备 · 购买套餐 · 查看用量</div>
    <div class="qr">${qrSVG()}</div>
    <div style="font-family:var(--num);font-size:10px;color:var(--text-3);
      letter-spacing:.08em;margin-top:12px"></div>
  </div>`;
}
/* ════════ ROUTE TABLE ════════ */
const ROWS={
  menu:rowsMenu, acct:rowsAcct, wifi:rowsWifi, sim:rowsSim, agglink:rowsAggLink,
  aggmode:rowsAggMode, net:rowsNet, dev:rowsDev, devinfo:rowsDevInfo,
  bright:rowsBright,
  pickA:()=>rowsPick('A'), pickB:()=>rowsPick('B'),
  sleep:()=>SLEEP.map((s,i)=>({t:s,rd:S.sleepIdx===i})),
  lang:()=>['中文','English'].map((s,i)=>({t:s,rd:S.lang===i})),
};
const VIEWS={
  home:viewHomeAgg, 'home-normal':viewHomeNormal, unact:viewUnact, nosim:viewNoSim,
  pwd:viewWifiPwd, clients:viewClients,
  diag:viewDiag, upg:viewUpg, app:viewApp,
};
function maxFocus(){
  /* +2 on every subpage: footer back button (slot m-2) and home button (m-1),
     in visual order — ↓ past the last row reaches back first */
  if(ROWS[S.page])return focusable(ROWS[S.page]()).length+2;
  if(S.page==='clients')return S.clients.length+2;
  /* diag / upg expose one action row (start / re-run / upgrade) only when the
     stage has something to trigger; the last two slots are back / home */
  if(S.page==='diag')return !S.diag||S.diag.cur>=DIAG.length?3:2;
  if(S.page==='upg')return !S.upg||S.upg.stage==='found'?3:2;
  if(S.page==='pwd'||S.page==='app')return 2;
  return 0;
}
function renderBody(){
  let b=$('body');
  if(ROWS[S.page]) b.innerHTML=buildList(ROWS[S.page]());
  else if(VIEWS[S.page]) b.innerHTML=VIEWS[S.page]();
  else b.innerHTML='';
  // both home variants must fit without scrolling
  let isHome=S.page==='home'||S.page==='home-normal';
  b.classList.toggle('nohome',isHome);
  // keep focused row in view
  let f=b.querySelector('.row.fx');
  if(f)f.scrollIntoView({block:'nearest'});
  if(isHome)checkFit(b);
}
/* nohome hides overflow, which would silently crop content instead of showing a
   scrollbar — so measure and shout if the home layout ever exceeds one screen */
function checkFit(b){
  requestAnimationFrame(()=>{
    let over=b.scrollHeight-b.clientHeight;
    let w=$('fitWarn'); if(!w)return;
    if(over>1){
      w.textContent=`主页溢出 ${over}px`;
      w.style.display='block';
      console.warn(`[fit] home overflows by ${over}px (${b.scrollHeight} > ${b.clientHeight})`);
    }else w.style.display='none';
  });
}
function render(){
  renderStatus(); renderHeader(); renderBody(); renderFooter(); syncRail();
}

/* ════════ RAIL ════════ */
const ST_LABEL={unactivated:'UNACTIVATED','no-sim':'NO SIM',online:'ONLINE'};
function syncRail(){
  let on=S.act==='online'&&S.agg;
  let m=$('tMode'); m.textContent=on?'AGGREGATED':'SINGLE';
  m.className='tv '+(on?'on':'off');
  let st=$('tState'); st.textContent=ST_LABEL[S.act];
  st.className='tv '+(S.act==='online'?'on':S.act==='no-sim'?'warn':'off');
  $('tPage').textContent=(S.page||'—').toUpperCase();
  if(S.act!=='online'){$('tUp').textContent='—';$('tPath').textContent='0 / 3'}
  else if(on){let t=aggTotals();$('tUp').textContent=t.up.toFixed(1)+' Mbps';$('tPath').textContent=t.n+' / 3'}
  else{let d=S.sims[S.defIdx];$('tUp').textContent=(d.st==='ok'?d.up.toFixed(1):'—')+' Mbps';$('tPath').textContent='1 / 3'}
  $('bAggr').classList.toggle('live',on);
}

/* ════════ NAV ════════ */
function go(p,f=0){S.stack.push({p:S.page,f:S.fx});S.page=p;S.fx=f;S.brightEdit=false;render();resetIdle()}
function back(){
  if(S.modal){closeModal();return}
  S.brightEdit=false;
  if(S.stack.length){let x=S.stack.pop();S.page=x.p;S.fx=x.f;render()}else home();
  resetIdle();
}
function home(){
  S.stack=[];S.fx=0;S.brightEdit=false;
  S.page=S.act==='unactivated'?'unact':S.act==='no-sim'?'nosim':(S.agg?'home':'home-normal');
  render();resetIdle();
}
function toast(msg,kind){
  let t=$('toast');
  t.textContent=msg;t.className='toast show'+(kind?' '+kind:'');
  clearTimeout(S.timers.toast);
  S.timers.toast=setTimeout(()=>t.className='toast',2000);
}
function resetIdle(){
  clearTimeout(S.timers.idle);
  S.timers.idle=setTimeout(()=>{
    if(S.page!=='home'&&S.page!=='home-normal'&&S.page!=='unact'&&S.page!=='nosim'){
      home();toast('已返回主屏');
    }
  },30000);
}
/* ════════ MODAL ════════ */
function openModal(title,desc,onYes,safe){
  S.modal={onYes};
  $('mTitle').textContent=title;$('mDesc').textContent=desc;
  $('mYes').className='fx'+(safe?' safe':'');
  $('modal').classList.add('show');
}
function closeModal(){S.modal=null;$('modal').classList.remove('show')}
/* ════════ CONFIRM ROUTER ════════ */
function confirm(){
  if(S.modal){let f=S.modal.onYes;closeModal();if(f)f();return}
  let p=S.page,f=S.fx;
  // home screens
  if(p==='home'||p==='home-normal'){go('menu');return}
  if(p==='unact'){toast('二维码已放大');return}
  if(p==='nosim'){go('menu');return}
  // guarded rows
  let rows=ROWS[p]?focusable(ROWS[p]()):null;
  if(rows&&rows[f]&&rows[f].dis){toast(rows[f].disMsg||'当前不可用');return}
  /* the footer buttons sit at the last two focus slots of every subpage,
     in visual order — back first (m-2), home last (m-1). Intercept globally
     so no case below ever sees those indexes */
  const mf=maxFocus();
  if(mf&&f===mf-2){back();return}
  if(mf&&f===mf-1){home();return}

  switch(p){
    case 'menu':{
      /* must stay in the same order as rowsMenu(). 信道优选 has no page yet, so
         its slot is null and the row just toasts instead of routing nowhere. */
      const dst=['wifi','sim','agglink','diag','net','dev','acct',null,'app'];
      if(!dst[f]){toast('功能开发中');break}
      go(dst[f]);break;
    }
    case 'acct':{
      // rows 0/1 are read-only; only the unbind row acts
      if(f===2){
        if(unbindPending()){
          toast(`解绑请求已发送，请在 APP 中确认（剩余 ${mmss(unbindLeft())}）`);break;
        }
        openModal('解除绑定',
          `将向 ${S.acct.name}（${maskPhone(S.acct.phone)}）发送解绑请求，需在松果智联 APP 中确认后生效。请求 10 分钟内有效，过期后可重新发送。`,
          ()=>{S.acct.unbindAt=Date.now();toast('解绑请求已发送，请在 APP 中确认')});
      }
      break;
    }
    case 'wifi':{
      if(f===0){S.wifi.on=!S.wifi.on;toast('Wi-Fi 已'+(S.wifi.on?'开启':'关闭'),S.wifi.on?'ok':'')}
      else if(f===1){S.wifi.band=!S.wifi.band;toast('多频合一 '+(S.wifi.band?'ON':'OFF'))}
      else if(f===2)toast('请在松果智联 APP 中修改');
      else if(f===3)go('pwd');
      else if(f===4){S.wifi.nfc=!S.wifi.nfc;toast('NFC 分享 '+(S.wifi.nfc?'ON':'OFF'))}
      else if(f===5)go('clients');
      break;
    }
    case 'sim':{
      if(f===0){S.smart=!S.smart;toast('智能选网 '+(S.smart?'ON':'OFF'),S.smart?'ok':'')}
      else{
        /* dis rows (unavailable card, or every card while smart-select is on) are
           already stopped by the guarded-row check above, which toasts disMsg */
        const map=[null,0,1,2,3,4];
        let i=map[f];
        if(i!==null&&i!==undefined){
          S.defIdx=i;toast('默认卡 → '+S.sims[i].nm,'ok');
        }
      }
      break;
    }
    case 'agglink':{
      if(f===0)go('pickA');
      else if(f===1)go('pickB');
      else if(f===2){
        if(S.sims[4].st!=='ok'){toast('USB 未插入');break}
        S.useUsb=!S.useUsb;toast('USB 外扩 '+(S.useUsb?'已加入':'已移除'));
      }
      else if(f===3)go('aggmode');
      break;
    }
    case 'pickA':{let i=[0,2][f];if(S.sims[i].st!=='ok'){toast('该卡不可用');break}
      S.linkA=i;toast('链路 A → '+S.sims[i].nm,'ok');back();break}
    case 'pickB':{let i=[1,3][f];if(S.sims[i].st!=='ok'){toast('该卡不可用');break}
      S.linkB=i;toast('链路 B → '+S.sims[i].nm,'ok');back();break}
    case 'aggmode':{S.aggMode=f;toast('模式 → '+MODES[f].n,'ok');back();break}
    case 'diag': runDiag(); break;
    case 'net':{
      if(f===0){S.rj45=S.rj45?0:1;toast('RJ45 → '+(S.rj45?'WAN':'LAN'),'ok')}
      else if(f===1)openModal('恢复默认配置','网络参数将重置为出厂默认值。',
        ()=>{S.rj45=0;toast('已恢复默认','ok')});
      break;
    }
    case 'dev':{
      if(f===0)go('bright');
      else if(f===1)go('lang');
      else if(f===2)go('sleep');
      else if(f===3)go('devinfo');
      else if(f===4)go('upg');
      else if(f===5)openModal('重启设备','设备将立即重启，网络会短暂中断。',
        ()=>{toast('设备正在重启…')},true);
      else if(f===6)openModal('恢复出厂设置','所有配置将被清除且不可撤销。',
        ()=>{toast('正在恢复出厂…','err')});
      break;
    }
    case 'sleep':{S.sleepIdx=f;toast('自动休眠 → '+SLEEP[f],'ok');back();break}
    case 'lang':{S.lang=f;toast(f?'Language → English':'语言 → 中文','ok');back();break}
    case 'upg': stepUpg(); break;
    case 'bright':{
      if(f===0){
        /* the dis guard above already toasted when auto-brightness owns the
           value, so reaching here means manual mode — toggle adjust mode */
        S.brightEdit=!S.brightEdit;
      }else if(f===1){
        S.autoBright=!S.autoBright;
        toast('自动亮度 '+(S.autoBright?'已开启':'已关闭'),S.autoBright?'ok':'');
      }
      break;
    }
    case 'clients':{
      if(S.clients.length===0)break;
      let c=S.clients[f];
      openModal('断开设备',`将断开「${c.n}」的 Wi-Fi 连接。`,()=>{
        S.clients.splice(f,1);
        if(S.fx>=S.clients.length)S.fx=Math.max(0,S.clients.length-1);
        toast('已断开 '+c.n,'ok');
      });
      break;
    }
    case 'pwd': case 'app': break;   // only footer slots — intercepted above
  }
  render();resetIdle();
}

/* ════════ AGGREGATION KEY ════════ */
function toggleAgg(){
  if(S.act!=='online'){toast('设备暂无可用网络','err');return}
  S.agg=!S.agg;
  toast(S.agg?'正在开启聚合…':'正在关闭聚合…');
  setTimeout(()=>{
    home();
    toast(S.agg?`聚合已开启 · ${aggTotals().n}路`:'已切换单卡模式',S.agg?'ok':'');
  },700);
}

/* ════════ DIAGNOSIS ════════ */
function runDiag(){
  if(S.diag&&S.diag.cur<DIAG.length)return;
  S.diag={cur:0,results:new Array(DIAG.length).fill(null)};
  render();
  const step=()=>{
    let i=S.diag.cur;
    if(i>=DIAG.length){S.diag.cur=DIAG.length;render();toast('诊断完成','ok');return}
    setTimeout(()=>{
      S.diag.results[i]={ok:true,ms:8+Math.floor(Math.random()*46)};
      S.diag.cur=i+1;render();step();
    },620);
  };
  step();
}
/* ════════ UPGRADE ════════ */
function stepUpg(){
  if(!S.upg){
    S.upg={stage:'check'};render();
    setTimeout(()=>{S.upg={stage:'found'};render()},1200);
    return;
  }
  if(S.upg.stage==='found'){
    if(S.batt<=20){toast('电量不足，请先充电','err');return}
    S.upg={stage:'run',pct:0};render();
    let iv=setInterval(()=>{
      S.upg.pct=Math.min(100,S.upg.pct+Math.ceil(Math.random()*9));
      render();
      if(S.upg.pct>=100){clearInterval(iv);
        setTimeout(()=>{S.upg={stage:'done'};render();toast('升级完成','ok')},400)}
    },260);
  }
}
/* ════════ BUTTON FEEDBACK ════════ */
function flash(id,ms=130){let e=$(id);if(!e)return;e.classList.add('hit');
  setTimeout(()=>e.classList.remove('hit'),ms)}

/* ════════ INPUT ════════ */
function moveFocus(d){
  // brightness adjust mode: OK on the value row enters it, ↑↓ tunes, OK exits
  if(S.page==='bright'&&S.brightEdit){
    S.bright=Math.max(10,Math.min(100,S.bright+d*10));
    render();return;
  }
  if(S.modal){ // toggle modal buttons
    let y=$('mYes'),n=$('mNo');
    let onYes=y.classList.contains('fx')&&!n.classList.contains('fx');
    y.classList.toggle('fx',!onYes);n.classList.toggle('fx',onYes);
    return;
  }
  let m=maxFocus();
  if(!m)return;
  let n=S.fx+d;
  if(n<0)n=m-2;        // ↑ past the first row lands on ‹ 返回, not 主页 — both directions reach back first
  else if(n>=m)n=0;    // ↓ past 主页 wraps to the first row
  S.fx=n;
  render();
}
document.addEventListener('keydown',e=>{
  resetIdle();
  if(e.key==='Enter'){
    e.preventDefault();
    /* ignore OS key-repeat: a held key would otherwise re-fire confirm and
       flapping toggles (v2.8: back is the footer button, no long-press left) */
    if(e.repeat)return;
    flash('bOk');
    confirm();
    return;
  }
  if(e.key==='ArrowUp'){e.preventDefault();flash('bUp');moveFocus(-1);return}
  if(e.key==='ArrowDown'){e.preventDefault();flash('bDn');moveFocus(1);return}
  if(e.key===' '){e.preventDefault();flash('bAggr',180);toggleAgg();return}
  if(e.key==='1'){
    e.preventDefault();
    const cyc=['unactivated','no-sim','online'];
    S.act=cyc[(cyc.indexOf(S.act)+1)%3];
    if(S.act==='online')S.agg=true;
    home();
    toast('演示状态 · '+({unactivated:'未激活','no-sim':'无可用 SIM',online:'已激活在线'})[S.act]);
  }
});

/* ════════ LIVE DATA ════════ */
function jitter(){
  if(S.act==='online'){
    S.sims.forEach(s=>{
      if(s.st!=='ok')return;
      s.up=Math.max(.4,+(s.up+(Math.random()-.5)*.9).toFixed(1));
      s.dn=Math.max(.3,+(s.dn+(Math.random()-.5)*.7).toFixed(1));
    });
    // consumed traffic tracks the paths actually carrying data
    let t=S.agg?aggTotals():{up:S.sims[S.defIdx].up,dn:S.sims[S.defIdx].dn};
    S.data.used=Math.min(S.data.total,
      +(S.data.used+(t.up+t.dn)*1.4/8/1024).toFixed(2));
  }
  S.temp=Math.max(36,Math.min(72,S.temp+(Math.random()<.5?-1:1)));
  S.uptime++;
  let d=new Date();
  S.time=pad(d.getHours())+':'+pad(d.getMinutes());
  render();
}

/* ════════ INIT ════════ */
home();
S.timers.tick=setInterval(jitter,1400);
console.log('%cBeWinner 屏幕原型 v2','color:#0A84FF;font-weight:600');
console.log('↑↓ 导航 / Enter 确认 / 底部栏‹返回 / Space 聚合键 / 1 切换状态');
</script>
</body>
</html>
